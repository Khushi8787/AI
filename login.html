<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login / Register – GLAMORA</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head><body>
<nav class="navbar"><div class="navbar-inner"><a href="index.html" class="logo">GLAM<span>ORA</span></a><div class="nav-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="rentals.html">Rent</a><a href="sell.html">Sell</a><a href="our-story.html">Our Story</a></div><div class="nav-actions"><a href="login.html" class="nav-icon"><i class="fas fa-user"></i></a><a href="cart.html" class="nav-icon"><i class="fas fa-shopping-bag"></i><span class="badge">0</span></a></div></div></nav>
<div class="auth-page"><div class="auth-card"><div class="logo" style="justify-content:center;margin-bottom:8px;font-size:24px;">GLAM<span>ORA</span></div><h2 id="authTitle">Welcome Back</h2><p class="auth-sub" id="authSub">Sign in to your account</p><div class="auth-tabs"><button class="auth-tab active" type="button" onclick="switchAuth('login')">Customer Login</button><button class="auth-tab" type="button" onclick="switchAuth('register')">Register</button><button class="auth-tab" type="button" onclick="switchAuth('admin')">Admin</button></div>
<form id="form-login"><div class="form-group"><label>Email</label><input name="email" type="email" placeholder="your@email.com" required></div><div class="form-group"><label>Password</label><input name="password" type="password" placeholder="••••••••" required></div><button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button><div class="auth-footer">Don't have an account? <a href="#" onclick="switchAuth('register');return false;">Register</a></div></form>
<form id="form-register" style="display:none;"><div class="form-group"><label>Full Name</label><input name="name" type="text" placeholder="Your name" required></div><div class="form-group"><label>Email</label><input name="email" type="email" placeholder="your@email.com" required></div><div class="form-group"><label>Phone</label><input name="phone" type="tel" placeholder="+91 98765 43210" required></div><div class="form-group"><label>Password</label><input name="password" type="password" placeholder="Minimum 6 characters" required></div><div class="form-group"><label>Confirm Password</label><input name="confirmPassword" type="password" placeholder="Repeat password" required></div><button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button><div class="auth-footer">Already have an account? <a href="#" onclick="switchAuth('login');return false;">Sign In</a></div></form>
<form id="form-admin" style="display:none;"><div class="form-group"><label>Admin Email</label><input name="email" type="email" placeholder="admin@glamora.in" required></div><div class="form-group"><label>Password</label><input name="password" type="password" placeholder="Admin password" required></div><button type="submit" class="btn btn-gold btn-block btn-lg">Admin Sign In</button><div class="auth-footer"><a href="#" onclick="switchAuth('login');return false;">← Back to Customer Login</a></div></form>
<p style="font-size:12px;color:var(--text-muted);margin-top:20px;text-align:center;">Demo admin: <strong>admin@glamora.in</strong> / <strong>Admin@123</strong></p></div></div>
<script src="js/main.js"></script></body></html>
